<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Say Hi</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
      background: #f0f4f8;
    }
    button {
      padding: 12px 24px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: white;
    }
    button:hover { background: #0056b3; }
    #msg {
      margin-top: 16px;
      font-size: 24px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
  <button onclick="sayHi()">Click Me</button>
  <div id="msg"></div>

  <script>
    function sayHi() {
      document.getElementById('msg').textContent = 'Hi!';
    }
  </script>
</body>
</html>
